skip_output:
  - meta
  - success
  - summary

pre-commit:
  parallel: true
  commands:
    rustfmt:
      tags: format
      glob: "*.rs"
      run: cargo fmt --check -- {staged_files}
    markdownlint:
      tags: format
      glob: "*.md"
      run: npx --yes markdownlint-cli2 {staged_files}

pre-push:
  parallel: true
  commands:
    clippy:
      tags: lint
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings
    test:
      tags: test
      glob: "{*.rs,test_cases/check/**/*.json,test_cases/check/**/*.md}"
      run: cargo test --all-features
