[package]
name = "cjkfmt"
version = "0.0.7"
edition = "2024"
authors = ["Suguru Yamamoto <sgryjp@gmail.com>"]
description = "Formatter for CJK text files"
repository = "https://github.com/sgryjp/cjkfmt"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["cargo", "derive", "wrap_help"] }
figment = { version = "0.10.19", features = ["env", "json"] }
home = "0.5.12"
serde = { version = "1.0.228", features = ["derive"] }
tree-sitter = "0.26.8"
thiserror = "2.0.12"
unicode-general-category = "1.1.0"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.2"
unicode-width = { version = "0.2.2", features = ["cjk"] }
yansi = { version = "1.0.1", features = ["detect-env", "detect-tty"] }

[dev-dependencies]
regex = "1.12.3"
rstest = "0.26.1"
serde_json = "1.0.149"
test-generator = "0.3.1"
tempfile = "3.23.0"

[build-dependencies]
cc = "1.2.61"
url = "2.5.4"
